onero_driver_node:
  ros__parameters:
    # 机械臂型号
    robot_model: "A1_dual"

    # 串口号
    device_left: "/dev/ttyACM0"
    device_right: "/dev/ttyACM1"

    # 双臂共享同一摆放方向，可选: "horizontal" 或 "vertical"
    mount_orientation: "vertical"
    
    # 自由度
    dof: 14
    
    # 状态发布频率（Hz）
    state_pub_rate: 100.0
    
    # MIT力控模式默认参数
    mit_mode:

      # 目标PD参数（7自由度）- 与 arm_control 保持一致
      left_kp_values: [150.0, 150.0, 150.0, 150.0, 30.0, 30.0, 30.0]
      left_kd_values: [4.0, 4.0, 4.0, 4.0, 1.0, 1.0, 1.0]

      right_kp_values: [150.0, 150.0, 150.0, 150.0, 30.0, 30.0, 30.0]
      right_kd_values: [4.0, 4.0, 4.0, 4.0, 1.0, 1.0, 1.0]

    # 初始关节角度
    left_initial_pos:  [0.5, 0.0, 0.0, -1.57, 0.0, 0.7, 0.0]
    right_initial_pos: [-0.5, 0.0, 0.0, 1.57, 0.0, -0.7, 0.0]

    # 夹爪（双臂模式：左右独立启用，平滑参数共用一份）
    gripper:
      left_enabled:  false
      right_enabled: false
      max_vel:  100.0
      max_acc:  250.0
      max_jerk: 1000.0
