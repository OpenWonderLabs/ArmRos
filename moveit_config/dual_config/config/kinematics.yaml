left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001

right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001

# Kinematics solver不能应用于双臂整体，只能分别应用于左右臂，因此left_arm和right_arm需要在.srdf中定义；否则会报错
# 作用是用来求解正运动学和逆运动学问题，比如拖动机械臂末端到某个位置时，求解对应的关节角度值
# 如果这里为空，会报错；
# 如果这里配置了dual_arm如下，但没有在.srdf中定义left_arm和right_arm和配置left_arm和right_arm的Kinematics solver，也会报错
# (比如：不会出现拖动机械臂末端的interactive marker,终端显示无可用的IK solver)
# dual_arm:
#   kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
#   kinematics_solver_search_resolution: 0.0050000000000000001
#   kinematics_solver_timeout: 0.0050000000000000001