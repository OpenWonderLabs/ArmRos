# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1-x1_l
      - joint2-x1_l
      - joint3-x1_l
      - joint4-x1_l
      - joint5-x1_l
      - joint6-x1_l
      - joint7-x1_l
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity